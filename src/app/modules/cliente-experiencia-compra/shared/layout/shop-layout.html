<div class="shop-shell">
  <a class="skip-link" href="#shop-main">Saltar al contenido</a>
  <header class="shop-header">
    <a class="brand" routerLink="/tienda" aria-label="LiveClothesShop, tienda">
      <span class="brand-mark" aria-hidden="true">L/C</span>
      <span>LiveClothes<span class="brand-light">Shop</span></span>
    </a>
    <nav class="shop-nav" aria-label="Navegación de la tienda">
      <a class="shop-link" routerLink="/tienda" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="active" ariaCurrentWhenActive="page"><span>Catálogo</span></a>
      <a class="shop-link" routerLink="/tienda/reservas" routerLinkActive="active" ariaCurrentWhenActive="page"><span>Mis reservas</span></a>
      <a class="shop-link" routerLink="/tienda/carrito" routerLinkActive="active" ariaCurrentWhenActive="page"><span>Carrito@if (carrito.estado()?.cantidadItems) { ({{ carrito.estado()?.cantidadItems }}) }</span></a>
    </nav>
    @if (auth.session(); as session) {
      <span class="header-user">{{ session.usuario.nombres || session.usuario.correo }}</span>
    }
    <div class="header-actions">
      @if (logoutError()) { <p class="notice error" role="alert">{{ logoutError() }}</p> }
      <button class="button primary" type="button" (click)="logout()" [disabled]="busy()">
        {{ busy() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
      </button>
    </div>
  </header>
  <main id="shop-main" tabindex="-1"><router-outlet /></main>
</div>
